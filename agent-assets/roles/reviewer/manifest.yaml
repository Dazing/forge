# Reviewer role policy. Fresh-context review of a merge request; one output
# schema and bounded skills.
role: reviewer
command: commands/review.md
skills:
  - skills/evidence-driven-review/SKILL.md
tools:
  - read-only-filesystem
  - model-sidecar
output_schema: schemas/review.schema.json
model_alias: factory-review
resource_policy:
  max_steps: 80
  wall_clock_seconds: 1800
  network: model-sidecar-only
